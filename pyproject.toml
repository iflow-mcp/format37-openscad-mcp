[project]
name = "iflow-mcp_format37-openscad"
version = "0.1.0"
description = "OpenSCAD MCP server for rendering OpenSCAD scripts and generating STL files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.1",
    "click>=8.2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.5.2",
    "requests>=2.32.5",
    "starlette>=0.28.0",
    "uvicorn[standard]>=0.31.1",
    "pillow>=11.3.0",
    "aiofiles>=23.2.1",
    "sentry-sdk>=2.38.0",
]

[project.scripts]
openscad-mcp = "stdio_server:main"

[tool.setuptools]
py-modules = ["server", "stdio_server", "mcp_image_utils"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"